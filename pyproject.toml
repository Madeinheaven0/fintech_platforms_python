[project]
name = "superprojectfinance"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.5",
    "rich>=15.0.0",
    "typer>=0.27.2",
]

[dependency-groups]
data = [
    "cython>=3.3.0",
    "matplotlib>=3.11.1",
    "memory-profiler>=0.61.0",
    "numba>=0.67.0",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "pingouin>=0.6.1",
    "polars>=1.44.1",
    "pyarrow>=25.0.1",
]

dev = [
    "pytest>=9.1.1",
]

[project.scripts]
cli-parser = "src.fintech_cli.parser_cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
